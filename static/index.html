<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дениско пиписко и Миланка милашка</title>
  <link rel="stylesheet" href="/static/css/style.css?v=9" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">▶</span>
        <span class="title">Дениско пиписко и Миланка милашка</span>
      </div>
      <div class="room-info" id="roomInfo">
        <span id="roomLabel">ты пока нигде не сидишь</span>
        <button id="copyLinkBtn" class="btn small" disabled>копируй ссылку</button>
      </div>
    </header>

    <main class="layout">
      <section class="player-section">
        <div class="video-wrap" id="videoWrap">
          <div class="placeholder" id="placeholder">
            <div class="ph-icon">🎬</div>
            <div class="ph-text">Тупень, сначала добавь ссылку 😏</div>
          </div>
          <video id="video" playsinline></video>
          <iframe id="iframe" allow="autoplay; fullscreen; picture-in-picture"></iframe>
          <div class="overlay-controls">
            <button id="fsBtn" class="fs-btn" title="Полный экран">⛶</button>
          </div>
        </div>

        <div class="controls">
          <button id="playPauseBtn" class="btn primary" disabled>▶ Play</button>
          <input type="range" id="seekBar" min="0" max="1000" value="0" step="1" disabled />
          <span id="timeLabel" class="time">0:00 / 0:00</span>
          <span id="viewersLabel" class="viewers">👁 0</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="card">
          <h3>Комната</h3>
          <div class="row">
            <input id="urlInput" type="url" placeholder="https://сайт-с-фильмом/..." />
            <button id="sendUrlBtn" class="btn primary">Кинуть ссылку</button>
          </div>
          <div class="row">
            <button id="createRoomBtn" class="btn primary">сделать комнату</button>
            <button id="joinRoomBtn" class="btn">зайти по ID</button>
          </div>
          <div class="row">
            <button id="loadInRoomBtn" class="btn">Влить в комнату</button>
          </div>
          <div class="row">
            <input id="roomIdInput" type="text" placeholder="ID комнаты сюда" />
          </div>
          <div id="statusMsg" class="status"></div>
        </div>

        <div class="card">
          <h3>Чё нашлось</h3>
          <div id="mediaList" class="media-list">
            <div class="empty">пока нихрена нет 🤷</div>
          </div>
        </div>

        <div class="card chat-card">
          <h3>чатик</h3>
          <div id="chatLog" class="chat-log"></div>
          <div class="row">
            <input id="chatName" type="text" placeholder="имя (пиши чё хочешь)" value="Гость" />
          </div>
          <div class="row">
            <input id="chatInput" type="text" placeholder="Пиши, не стесняйся..." />
            <button id="chatSendBtn" class="btn small">➤</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/static/js/app.js?v=9"></script>
</body>
</html>
